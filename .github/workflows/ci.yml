name: CI

# Pull requests only. Pushes to master are gated by the `quality` job in
# docker.yml, which must pass before the image is published — running the same
# checks here as well only duplicated work on every master build.
on:
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Build frontend
        run: yarn build:frontend
