name: CI

# Pull requests only. Pushes to master are gated by the `quality` job in
# docker.yml, which must pass before the image is published — running the same
# checks here as well only duplicated work on every master build.
on:
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Validate monitoring dashboard
        run: jq empty monitoring/grafana-dashboard.json
