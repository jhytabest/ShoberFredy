name: Build and publish Docker image

# Builds ghcr.io/jhytabest/shoberfredy on every master push (and tags).
# Deployment to the homeserver stays in the homeserver repo: its
# services/fredy compose pulls this image instead of patching upstream.
#
# Every third-party action is pinned to a commit SHA, not a tag. This workflow
# holds `packages: write` and a token that dispatches a production deployment,
# so a retagged upstream action would be able to publish and roll out a
# malicious image without review.
#
# The daily schedule exists for CloakBrowser. The Dockerfile installs it
# unpinned and busts that layer's cache whenever npm publishes a new version,
# but a build only ever ran on a source push — so between commits the deployed
# stealth Chromium aged indefinitely while bot detection moved on. The schedule
# decouples "browser is current" from "someone changed the code".
#
# Daily rather than weekly because upstream ships that often: 0.5.1 on
# 2026-07-23, 0.5.2 on 07-25, 0.5.3 on 07-30. A weekly cadence would routinely
# run a release or two behind, which is the whole failure being fixed. Nothing
# else in the image drifts — every other dependency is lockfile-pinned — so a
# run with no new release rebuilds entirely from cache and redeploys an
# identical image.

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  schedule:
    # 03:17 UTC — clear of the 02:00 UTC market-model retrain so a redeploy
    # cannot terminate a training child process mid-run.
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint


  build-and-push-image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are spelled out rather than left to the action's defaults, which
      # emit `nightly` for a schedule event and no branch tag at all. The
      # deployment dispatch below hands the homeserver `:master`, so a scheduled
      # CloakBrowser rebuild has to land on that same tag or it would publish an
      # image nothing ever pulls.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}

      # Homeserver is a single amd64 box; skipping arm64 halves build time.
      - name: Build Docker image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The homeserver deploy gates on this image's own HEALTHCHECK, so a build
      # that cannot reach a healthy /health must never be published. Exercises
      # the real startup path: CloakBrowser binary check, SQLite init, the full
      # migration run, worker startup. The API key is a placeholder — /health
      # only checks that one is configured, it makes no outbound call.
      - name: Smoke test the image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(head -n1 <<< "$IMAGE_TAGS")
          container=$(docker run --detach \
            --env GOOGLE_GEOCODING_API_KEY=smoke-test-placeholder \
            --env FREDY_MARKET_EXPORTER_PORT=0 \
            --env FREDY_MARKET_MODEL_CRON=0 \
            "$image")
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            status=$(docker inspect "$container" --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            if [ "$status" = unhealthy ] || [ "$(docker inspect "$container" --format '{{.State.Running}}')" != true ]; then
              echo "::error::container became $status before reporting healthy"
              docker logs "$container"
              exit 1
            fi
            sleep 5
          done
          if [ "${status:-}" != healthy ]; then
            echo "::error::container never reported healthy"
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" curl -fsS --max-time 10 http://localhost:9998/health

      - name: Publish Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Trigger Fredy-only homeserver deployment
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.HOMESERVER_DISPATCH_TOKEN }}
        run: |
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY}:master" \
            '{event_type:"shoberfredy_image_published",client_payload:{source_sha:$source_sha,image:$image}}' \
            | gh api --method POST /repos/jhytabest/homeserver/dispatches --input -
