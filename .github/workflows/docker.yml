name: Build and publish Docker image

# Builds ghcr.io/jhytabest/shoberfredy on every master push (and tags).
# Deployment to the homeserver stays in the homeserver repo, where Renovate
# advances the published master digest through the normal release path.
#
# Every third-party action is pinned to a commit SHA, not a tag. CloakBrowser
# is lockfile-pinned too and updated by Renovate, so every image is reproducible.

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Validate monitoring dashboard
        run: jq empty monitoring/grafana-dashboard.json


  build-and-push-image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}

      # Homeserver is a single amd64 box; skipping arm64 halves build time.
      - name: Build Docker image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The homeserver deploy gates on this image's own HEALTHCHECK, so a build
      # that cannot reach a healthy /health must never be published. Exercises
      # the real startup path: CloakBrowser binary check, SQLite init, the full
      # migration run, worker startup. The API key is a placeholder — /health
      # only checks that one is configured, it makes no outbound call.
      - name: Smoke test the image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(head -n1 <<< "$IMAGE_TAGS")
          container=$(docker run --detach \
            --env GOOGLE_GEOCODING_API_KEY=smoke-test-placeholder \
            --env FREDY_MARKET_EXPORTER_PORT=0 \
            --env FREDY_MARKET_MODEL_CRON=0 \
            "$image")
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            status=$(docker inspect "$container" --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            if [ "$status" = unhealthy ] || [ "$(docker inspect "$container" --format '{{.State.Running}}')" != true ]; then
              echo "::error::container became $status before reporting healthy"
              docker logs "$container"
              exit 1
            fi
            sleep 5
          done
          if [ "${status:-}" != healthy ]; then
            echo "::error::container never reported healthy"
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" curl -fsS --max-time 10 http://localhost:9998/health

      - name: Publish Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"
