services:
  shoberfredy:
    container_name: shoberfredy
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jhytabest/shoberfredy
    environment:
      - NODE_ENV=production
    env_file:
      - path: ./geocoder.env
        required: false
    volumes:
      - ./conf:/conf
      - ./db:/db
    ports:
      - "9998:9998"
    restart: unless-stopped
    # Resource limits to prevent runaway memory usage from Chromium
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:9998/"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s

  market-exporter:
    container_name: shoberfredy-market-exporter
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jhytabest/shoberfredy
    command: ["node", "tools/market/marketExporter.js"]
    environment:
      FREDY_MARKET_DB_PATH: /db/listings.db
      FREDY_MARKET_EXPORTER_PORT: "9217"
    volumes:
      - ./db:/db:ro
    ports:
      - "9217:9217"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9217/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  market-model:
    container_name: shoberfredy-market-model
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jhytabest/shoberfredy
    command: ["node", "tools/market/marketModel.js", "daemon"]
    environment:
      FREDY_MARKET_DB_PATH: /db/listings.db
      FREDY_MARKET_MODEL_INTERVAL_SECONDS: "86400"
    volumes:
      - ./db:/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "tools/market/marketModel.js", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
