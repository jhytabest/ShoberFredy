services:
  shoberfredy:
    container_name: shoberfredy
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SHOBERFREDY_IMAGE:-ghcr.io/jhytabest/shoberfredy}
    user: '10001:10001'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
    env_file:
      - path: ./.env.local
        required: false
    volumes:
      - ./conf:/conf
      - ./db:/db
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=64m
    ports:
      - '9998:9998'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--show-error', '--max-time', '5', 'http://localhost:9998/health']
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 5m
