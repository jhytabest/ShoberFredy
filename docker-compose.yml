services:
  shoberfredy:
    container_name: shoberfredy
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SHOBERFREDY_IMAGE:-ghcr.io/jhytabest/shoberfredy}
    environment:
      - NODE_ENV=production
      # In-process market services (set to 0 to disable):
      - FREDY_MARKET_EXPORTER_PORT=9217
      - FREDY_MARKET_MODEL_INTERVAL_SECONDS=86400
    env_file:
      - path: ./.env.local
        required: false
    volumes:
      - ./conf:/conf
      - ./db:/db
    ports:
      - '9998:9998'
      - '9217:9217'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--show-error', '--max-time', '5', 'http://localhost:9998/health']
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
